<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toteutuksen tiedot - Digitekniikat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Sama navigaatio, joka löytyy index.html-sivulta -->
    <nav class="navbar navbar-expand-sm custom">
        <div class="container-fluid">

            <a class="navbar-brand navbar-text d-flex align-items-center gap-2" href="index.html">
                <span class="fs-4 fw-bold">JSON-tehtävät</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mobiiliValikko">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mobiiliValikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Tekniikat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="toteutus.html">Toteutus</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div id="vastaus">
            <p>Ladataan toteutuksen tietoja...</p>
        </div>
    </main>

    <script>
        //Haetaan toteutus.JSON
        fetch('toteutus.JSON')
            .then(function (response) {
                return response.json();
            })
            .then(function (responseJson) {
                naytaToteutus(responseJson);
            })
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            });

        //Funktio datan esittämiseen
        function naytaToteutus(data) {
            var tiedot = "";

            <!-- Otsikko ja tiedot -->
            tiedot += "<h1>" + data.nimi + "</h1>";
            tiedot += "<p><b>Ajankohta:</b> " + data.alkamisaika + " – " + data.loppumisaika + " (" + data.kesto_viikkoina + "
        viikkoa)</p > ";
            tiedot += "<p><b>Osallistujien lukumäärä:</b> " + data.osallistujat_maara + " kpl</p>";

            <!-- For-silmukka -->
            tiedot += "<h3>Osallistujat:</h3>";
            tiedot += "<ul>";
            for (var i = 0; i < data.osallistujat.length; i++) { tiedot += "<li>" + data.osallistujat[i] + "</li>"; } tiedot
                += "</ul>"; //Kuva tiedot +="<div class='mt-4'>" ; tiedot +="<img src='" + data.kuva
            + "' alt='Toteutuksen kuva' class='img-fluid rounded' style='max-width: 500px;'>"; tiedot += "</div>";
            document.getElementById("vastaus").innerHTML = tiedot;
        } </script>
</body>

</html>
