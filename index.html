<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anitan sivut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-sm custom">
        <div class="container-fluid">

            <a class="navbar-brand navbar-text d-flex align-items-center gap-2" href="index.html">
                <img src="unicorn.jpg" alt="Logo" width="55" height="55" class="d-inline-block rounded">
                <span class="fs-3">Yksisarviset</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mobiiliValikko">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mobiiliValikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Eka</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="toka.html">Toka</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="kolmas.html">Kolmas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="mt-4">
        <div class="container">
            <h1 class="mb-4">Kuvakaruselli</h1>
            <div id="omakaruselli" class="carousel slide" data-bs-ride="carousel">

                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#omakaruselli" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Dia 1"></button>
                    <button type="button" data-bs-target="#omakaruselli" data-bs-slide-to="1"
                        aria-label="Dia 2"></button>
                    <button type="button" data-bs-target="#omakaruselli" data-bs-slide-to="2"
                        aria-label="Dia 3"></button>
                </div>

                <div class="carousel-inner rounded shadow">

                    <div class="carousel-item active">
                        <img src="unicorn1.jpg" class="d-block w-100" alt="Yksisarvinen 1"
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Yksisarvinen 1</h5>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="unicorn2.jpg" class="d-block w-100" alt="Yksisarvinen 2"
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Yksisarvinen 2</h5>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="unicorn4.png" class="d-block w-100" alt="Yksisarvinen 3"
                        <div class="carousel-caption d-none d-md-block">
                            <h5>Yksisarvinen 3</h5>
                        </div>
                    </div>

                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#omakaruselli" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Edellinen</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#omakaruselli" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Seuraava</span>
                </button>

            </div>
        </div>
    </main>

</body>

</html>
