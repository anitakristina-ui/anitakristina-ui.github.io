<!DOCTYPE html>
<html lang="fi">

<head>
    <title>Anitan autokauppa - Yhteydenotto</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Oman tyylitiedostoni linkittäminen -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Otsikkoalue -->
    <div class="p-5 bg-primary text-white text-center">
        <h1>Tervetuloa Anitan autokauppaan</h1>
        <p>Osta tai vaihda autosi parhaaseen hintaan!</p>
    </div>

    <!-- Ylänavigaatio -->
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Etusivu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="yhteydenotto.html">Yhteydenotto</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Sivun pääsäiliö -->
    <div class="container my-5">

        <h2>Ota yhteyttä</h2>

        <!-- Yhteydenottolomake -->
        <form>
            <!-- Nimi -->
            <div class="mb-3">
                <label for="nimiInput" class="form-label">Nimi</label>
                <input type="text" class="form-control" id="nimiInput" placeholder="Matti Meikäläinen" required>
            </div>

            <!-- Sähköposti -->
            <div class="mb-3">
                <label for="emailInput" class="form-label">Sähköpostiosoite</label>
                <input type="email" class="form-control" id="emailInput" placeholder="nimi@esimerkki.fi" required>
                <div id="emailHelp" class="form-text">Määritämme sähköpostiasi vain viestintään.</div>
            </div>

            <!-- Aihe / Alasvetovalikko -->
            <div class="mb-3">
                <label for="aiheSelect" class="form-label">Yhteydenoton aihe</label>
                <select class="form-select" id="aiheSelect">
                    <option selected disabled value="">Valitse aihe...</option>
                    <option value="1">Yleinen kysymys</option>
                    <option value="2">Tarjouspyyntö</option>
                    <option value="3">Palaute</option>
                </select>
            </div>

            <!-- Viesti -->
            <div class="mb-3">
                <label for="viestiTextarea" class="form-label">Viesti</label>
                <textarea class="form-control" id="viestiTextarea" rows="4"
                    placeholder="Kirjoita viestisi tähän..."></textarea>
            </div>

            <!-- Valintaruutu -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="ehdotCheck" required>
                <label class="form-check-label" for="ehdotCheck">Hyväksyn tietosuojaehdot</label>
            </div>

            <!-- Lähetyspainike -->
            <button type="submit" class="btn btn-primary">Lähetä viesti</button>
        </form>

    </div>

    <!-- Alatunniste -->
    <div class="mt-5 p-4 bg-dark text-white text-center">
        <p>© Anitan autokauppa</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
